<text x="0" y="16" fill="var(--fg)" font-size="13" font-weight="600">How deep a Detroit start usually goes</text>
<text x="0" y="34" fill="var(--muted)" font-size="11">Each bar counts Detroit starts by batters faced, all 118 regular season games. Roughly nine</text>
<text x="0" y="48" fill="var(--muted)" font-size="11">batters is three innings, 22 is the median start, 27 is three times through a lineup.</text>
