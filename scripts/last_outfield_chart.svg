<title id="of-title">Detroit outfielders by OPS, measured against replacement level</title>
<desc id="of-desc">Riley Greene sits well above the replacement baseline. Kerry Carpenter sits a little above it and Matt Vierling sits below it, so 2 of the 3 injured outfielders were producing at or under the level of the players replacing them.</desc>
<text x="0" y="16" fill="var(--fg)" font-size="13" font-weight="600">Only 1 of the 3 was hitting</text>
<text x="0" y="34" fill="var(--muted)" font-size="11">Bars run from replacement level (0.604 OPS, the league's own under-150-PA hitters). Right is better.</text>
